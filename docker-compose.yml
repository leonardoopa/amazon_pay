services:
  amazon_pay:
    build: .
    image: amazon_pay:latest
    container_name: amazon_pay_container
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/promos.db
      # Dentro do container o callback do OAuth precisa escutar em 0.0.0.0
      # pra o navegador do host alcancar a porta publicada.
      OAUTH_BIND_HOST: 0.0.0.0
    volumes:
      - ./data:/app/data
      # Editar a watchlist sem rebuildar a imagem.
      - ./watchlist.json:/app/watchlist.json:ro
    ports:
      # So usada pelo `ml-auth`; o daemon nao escuta nada.
      - "8123:8123"
    command: ["daemon"]
    healthcheck:
      test: ["CMD", "amazon_pay", "stats"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30s
