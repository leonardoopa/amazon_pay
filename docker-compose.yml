services:
  amazon_pay:
    build: .
    image: amazon_pay:latest
    container_name: amazon_pay_container
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/promos.db
      # Dentro da rede do compose o host e o nome do servico, nao localhost.
      EVOLUTION_BASE_URL: http://evolution:8080
    volumes:
      - ./data:/app/data
      # Editar a watchlist sem rebuildar a imagem.
      - ./watchlist.json:/app/watchlist.json:ro
    # Sem ports: o `ml-auth` e por colagem manual da URL, nada escuta.
    command: ["daemon"]
    depends_on:
      - evolution
    healthcheck:
      test: ["CMD", "amazon_pay", "stats"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30s

  # Gateway nao oficial (Baileys) -- e o que alcanca grupo comum do WhatsApp.
  # O numero pareado aqui pode ser banido pela Meta: use um chip secundario.
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # A v2 exige Postgres -- ela roda Prisma e sai em loop de "Database
      # provider invalid" se voce tentar subir sem banco. Nao ha modo
      # so-arquivo, apesar do volume de instancias existir.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      # A credencial da sessao do WhatsApp vive aqui: sem isso, todo restart
      # do container pede pareamento novo.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: Ofertas
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      # So no loopback: o `wa-connect` e o `wa-groups` rodam da sua maquina, e
      # essa porta com a API key e acesso total ao WhatsApp pareado.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    # Sem ports: so a Evolution fala com ele, pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evolution_instances:
  evolution_postgres:
