# Rodando 24/7 o driver json-file cresce sem teto e enche o disco em alguns
# meses -- e disco cheio trava os tres containers de uma vez. 30MB por servico
# e suficiente pra investigar um incidente recente.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  amazon_pay:
    build: .
    image: amazon_pay:latest
    container_name: amazon_pay_container
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DB_PATH: /app/data/promos.db
      # Dentro da rede do compose o host e o nome do servico, nao localhost.
      EVOLUTION_BASE_URL: http://evolution:8080
    volumes:
      - ./data:/app/data
      # Editar a watchlist sem rebuildar a imagem.
      - ./watchlist.json:/app/watchlist.json:ro
    ports:
      # So no loopback: /run dispara rodada e gasta cota do Gemini, e /stats
      # expoe o estado do banco. De fora, use tunel SSH -- igual a Evolution.
      - "127.0.0.1:8000:8000"
    command: ["serve"]
    depends_on:
      - evolution
    healthcheck:
      # A imagem e slim e nao tem curl. O urlopen levanta em 503 (o /health
      # responde isso quando o banco cai ou o worker morre), e excecao vira
      # exit code 1 -- que e exatamente o que o healthcheck precisa ver.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=10)
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 30s

  # Gateway nao oficial (Baileys) -- e o que alcanca grupo comum do WhatsApp.
  # O numero pareado aqui pode ser banido pela Meta: use um chip secundario.
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    logging: *logging
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # A v2 exige Postgres -- ela roda Prisma e sai em loop de "Database
      # provider invalid" se voce tentar subir sem banco. Nao ha modo
      # so-arquivo, apesar do volume de instancias existir.
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      # A credencial da sessao do WhatsApp vive aqui: sem isso, todo restart
      # do container pede pareamento novo.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      CONFIG_SESSION_PHONE_CLIENT: Ofertas
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      # So no loopback: o `wa-connect` e o `wa-groups` rodam da sua maquina, e
      # essa porta com a API key e acesso total ao WhatsApp pareado.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    # Sem ports: so a Evolution fala com ele, pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evolution_instances:
  evolution_postgres:
