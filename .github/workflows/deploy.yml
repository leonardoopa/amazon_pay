# Publica em produção a cada push em `main`.
#
# O código vai por rsync a partir do runner, e não por `git pull` no servidor.
# O repositório é privado: um pull exigiria guardar credencial do GitHub na
# VPS, e credencial parada num servidor é a que ninguém lembra de rotacionar.
# O runner já tem o código no checkout, então ele empurra.
#
# O `.env` e o `data/` NUNCA são tocados: um é segredo que só existe no
# servidor, o outro é o histórico de preço e a lista de e-mails. Estão nos
# excludes do rsync, que roda com `--delete`.
#
# Para publicar sem esperar um push, use "Run workflow" na aba Actions
# (workflow_dispatch).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Dois deploys ao mesmo tempo se sobrescreveriam no meio do build. Enfileira.
  #
  # `cancel-in-progress: false` de propósito: cancelar um deploy pela metade
  # deixa o servidor com arquivo novo e container velho, que é pior do que
  # esperar o anterior terminar.
  group: deploy-producao
  cancel-in-progress: false

jobs:
  # A suíte inteira antes de qualquer coisa tocar o servidor. Reusa o workflow
  # de testes em vez de repetir os passos.
  testes:
    uses: ./.github/workflows/testes.yml

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Preparar chave SSH
        env:
          CHAVE: ${{ secrets.VPS_SSH_KEY }}
          HOSTS_CONHECIDOS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Host key fixado. Sem isto o primeiro deploy aceitaria qualquer
          # servidor que respondesse no IP -- e o que trafega aqui dá acesso
          # de shell à produção.
          printf '%s\n' "$HOSTS_CONHECIDOS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Enviar o código
        env:
          ALVO: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          # `--inplace` por causa do bind mount de ARQUIVO do watchlist.json.
          # Sem ele o rsync escreve num temporário e renomeia, o rename troca o
          # inode, e o mount do container continua apontando para o inode
          # antigo -- que agora não tem mais nome. O resultado é silencioso: o
          # arquivo no servidor está novo, o container lê o anterior, e o
          # deploy passa verde. Medido em 01/09/2026: host inode 358, container
          # inode 594, md5 diferentes, container rodando com 181 termos
          # enquanto o servidor já tinha 191.
          #
          # Só se via quando o deploy trocava a imagem também: aí o container
          # era recriado e o mount refeito. Deploy que só mexe na watchlist não
          # troca imagem, e era exatamente o caso mais comum.
          rsync -az --delete --inplace \
            -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'data' \
            --exclude 'backups' \
            --exclude 'docker-compose.override.yml' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude 'web/staticfiles' \
            ./ "$ALVO:~/amazon_pay/"

      - name: Build e subida
        env:
          ALVO: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$ALVO" bash -euo pipefail <<'REMOTO'
          cd ~/amazon_pay

          # O overlay de 2 GB está nos excludes do rsync porque é um symlink
          # que só existe no servidor. Recriado aqui de forma idempotente: sem
          # ele, os cinco containers não cabem na máquina.
          ln -sfn docker-compose.vps-2gb.yml docker-compose.override.yml

          # Build antes de mexer no que está no ar. As camadas de pip vêm do
          # cache quando requirements.txt não mudou, então o pico costuma ser
          # só o collectstatic -- cabe na folga da máquina sem derrubar nada.
          docker compose build

          # `up -d` recria só o que mudou de imagem. O bot e o site
          # compartilham a mesma imagem e reiniciam juntos; a coleta retoma no
          # próximo intervalo e a fila é persistente.
          docker compose up -d

          # A watchlist entra por bind mount de arquivo, que é frágil a
          # qualquer coisa que troque o inode -- `--inplace` no rsync resolve o
          # caso conhecido, mas uma edição manual no servidor com `vim` ou
          # `sed -i` recria o defeito, e ele é invisível. Comparar o que o
          # container LÊ com o que está no disco é a única checagem que pega
          # isso; se divergir, recria o container e confere de novo.
          # `--inplace` escreve direto no arquivo, sem o rename atomico. Isso e
          # o que preserva o inode do bind mount, mas troca um risco por
          # outro: transferencia interrompida deixa o arquivo pela metade, e a
          # comparacao de md5 abaixo nao ve isso -- disco e container ficam
          # igualmente corrompidos. Validar o JSON e o que pega esse caso, e
          # aqui e barato: um `json.loads` contra o mesmo arquivo que a rodada
          # vai ler.
          python3 -c 'import json,sys; json.load(open("watchlist.json"))' || {
            echo "watchlist.json chegou corrompido no servidor. Abortando."
            exit 1
          }

          soma_no_disco() { md5sum watchlist.json | cut -d' ' -f1; }
          soma_no_container() {
            docker compose exec -T amazon_pay python -c \
              'import hashlib,pathlib;print(hashlib.md5(pathlib.Path("/app/watchlist.json").read_bytes()).hexdigest())'
          }

          if [ "$(soma_no_disco)" != "$(soma_no_container)" ]; then
            echo "O container lê uma watchlist diferente da que está no disco."
            echo "Recriando o serviço para refazer o bind mount."
            docker compose up -d --force-recreate amazon_pay
            sleep 5
            if [ "$(soma_no_disco)" != "$(soma_no_container)" ]; then
              echo "Continua divergindo depois de recriar. Abortando o deploy."
              exit 1
            fi
          fi

          # Imagem antiga sem tag acumula a cada deploy, e disco cheio derruba
          # os cinco containers de uma vez. Só imagens penduradas: volume e
          # container em uso não são tocados.
          docker image prune -f
          REMOTO

      - name: Conferir se subiu de pé
        env:
          ALVO: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes "$ALVO" bash -euo pipefail <<'REMOTO'
          cd ~/amazon_pay

          # O healthcheck do compose leva até um minuto para virar. Espera
          # ativa, com teto: deploy que "passou" com o site fora do ar é pior
          # do que deploy vermelho.
          for tentativa in $(seq 1 24); do
            saude=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              http://127.0.0.1:8000/health || true)
            site=$(docker compose exec -T web python -c \
              'import urllib.request;print(urllib.request.urlopen("http://127.0.0.1:8001/saude/",timeout=10).status)' \
              2>/dev/null || true)
            if [ "$saude" = "200" ] && [ "$site" = "200" ]; then
              echo "API e site respondendo (tentativa $tentativa)."
              docker compose ps
              exit 0
            fi
            sleep 5
          done

          echo "Deploy subiu, mas API ou site não responderam em 2 minutos." >&2
          docker compose ps >&2
          docker compose logs --no-color --tail 40 web amazon_pay >&2
          exit 1
          REMOTO
