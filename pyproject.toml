[project]
name = "promo"
version = "0.1.0"
description = "Coletor de promocoes (Mercado Livre + Amazon) com curadoria por preco historico"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "anthropic>=0.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
promo = "promo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
