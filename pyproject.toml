[project]
name = "promo"
version = "0.1.0"
description = "Coletor de promocoes (Mercado Livre + Amazon) com curadoria por preco historico"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "google-genai>=1.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
amazon_pay = "promo.cli:main"
promo = "promo.cli:main"  # alias curto

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
